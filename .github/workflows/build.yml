name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: |
          echo ">>> Running tests..."
          FAILED=""
          for pkg in $(go list ./...); do
            echo "--- Testing $pkg ---"
            set +e
            go test "$pkg" 2>&1
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::error::TEST FAILED: $pkg (exit code: $EXIT_CODE)"
              FAILED="$FAILED $pkg"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "============================================"
            echo ">>> FAILED PACKAGES:$FAILED"
            echo "============================================"
            exit 1
          fi
          echo "All basic tests passed"

      - name: Run tests with coverage
        run: |
          echo ">>> Running tests with coverage..."
          FAILED=""
          TMPDIR=$(mktemp -d)
          echo "mode: set" > "$TMPDIR/coverage.out"
          for pkg in $(go list ./...); do
            echo "--- Testing $pkg ---"
            set +e
            go test -coverprofile="$TMPDIR/coverage.tmp" "$pkg" 2>&1
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::error::COVERAGE TEST FAILED: $pkg (exit code: $EXIT_CODE)"
              FAILED="$FAILED $pkg"
            fi
            if [ -f "$TMPDIR/coverage.tmp" ]; then
              tail -n +2 "$TMPDIR/coverage.tmp" >> "$TMPDIR/coverage.out"
              rm "$TMPDIR/coverage.tmp"
            fi
          done
          cp "$TMPDIR/coverage.out" coverage.out
          rm -rf "$TMPDIR"
          if [ -n "$FAILED" ]; then
            echo "============================================"
            echo ">>> FAILED PACKAGES:$FAILED"
            echo "============================================"
            exit 1
          fi
          echo "--- coverage summary ---"
          go tool cover -func=coverage.out | tail -5

      - name: Check for vulnerable dependencies
        continue-on-error: true
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    needs: quality
    strategy:
      matrix:
        go-version: ['1.25']
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          go build -o cortex-${{ matrix.platform }}-amd64 ./cmd/cortex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.platform }}-amd64
          path: cortex-${{ matrix.platform }}-amd64*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
