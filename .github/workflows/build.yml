name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: |
          echo ">>> Running tests..."
          set +e
          go test ./... 2>&1 | tee /tmp/test_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "============================================"
            echo ">>> TESTS FAILED (exit code: $EXIT_CODE) <<<"
            echo "============================================"
            echo ">>> Full output (last 50 lines):"
            tail -50 /tmp/test_output.log
            echo "============================================"
            exit $EXIT_CODE
          fi
          echo "All basic tests passed"

      - name: Run tests with coverage
        run: |
          echo ">>> Running tests with coverage..."
          set +e
          go test -coverprofile=coverage.out ./... 2>&1 | tee /tmp/coverage_output.log
          COV_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $COV_EXIT_CODE -ne 0 ]; then
            echo "============================================"
            echo ">>> COVERAGE TESTS FAILED (exit code: $COV_EXIT_CODE) <<<"
            echo "============================================"
            echo ">>> Full output (last 50 lines):"
            tail -50 /tmp/coverage_output.log
            echo "============================================"
            exit $COV_EXIT_CODE
          fi
          echo "--- coverage summary ---"
          go tool cover -func=coverage.out | tail -5

      - name: Check for vulnerable dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    needs: quality
    strategy:
      matrix:
        go-version: ['1.25']
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          go build -o cortex-${{ matrix.platform }}-amd64 ./cmd/cortex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.platform }}-amd64
          path: cortex-${{ matrix.platform }}-amd64*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
