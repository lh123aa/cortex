name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          set -e
          for pkg in $(go list ./...); do
            echo ">>> Testing $pkg..."
            if ! go test -cover "$pkg" 2>&1; then
              echo "❌ FAILED: $pkg"
              exit 1
            fi
            echo ""
          done
          echo ">>> All packages passed. Running final coverage..."
          go test -coverprofile=coverage.out ./...
          echo "--- coverage summary ---"
          go tool cover -func=coverage.out | tail -5

      - name: Check for vulnerable dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.25'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    needs: quality
    strategy:
      matrix:
        go-version: ['1.25']
        platform: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: |
          go build -o cortex-${{ matrix.platform }}-amd64 ./cmd/cortex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.platform }}-amd64
          path: cortex-${{ matrix.platform }}-amd64*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate release notes
        id: release_notes
        run: |
          echo 'notes<<EOF' >> $GITHUB_OUTPUT
          echo "# Cortex ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "See [CHANGELOG.md](CHANGELOG.md) for full release notes." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts
          for dir in cortex-*/; do
            platform="${dir%/}"
            mv "${dir}"/* "./release-artifacts/${platform}.tar.gz" 2>/dev/null || true
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
