name: Go Report Card

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Go Report Card
        run: |
          curl -X POST -F "repo=https://github.com/${{ github.repository }}" https://goreportcard.com/checks
          echo "Go Report Card triggered for ${{ github.repository }}"
