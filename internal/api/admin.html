<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; }
  .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #7B61FF; }
  .card { background: #1a1a2e; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #2a2a4a; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .stat { text-align: center; padding: 1rem; background: #12122a; border-radius: 8px; }
  .stat-value { font-size: 2rem; font-weight: 700; color: #7B61FF; }
  .stat-label { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.3rem; }
  .badge-green { background: #1a3a2a; color: #4ade80; }
  .badge-blue { background: #1a2a3a; color: #60a5fa; }
  input, button { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #333; background: #1a1a2e; color: #e0e0e0; font-size: 0.9rem; }
  input { width: 100%; margin-bottom: 0.5rem; }
  button { background: #7B61FF; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #6a50ee; }
  .result { margin-top: 0.5rem; padding: 0.5rem; background: #12122a; border-radius: 6px; font-size: 0.85rem; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
  .footer { text-align: center; font-size: 0.8rem; color: #555; margin-top: 2rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🧠 Cortex Admin</h1>

  <div class="card">
    <h2 style="font-size:1rem;margin-bottom:0.8rem;">📊 系统状态</h2>
    <div class="stat-grid">
      <div class="stat"><div class="stat-value" id="docCount">-</div><div class="stat-label">文档</div></div>
      <div class="stat"><div class="stat-value" id="chunkCount">-</div><div class="stat-label">分块</div></div>
      <div class="stat"><div class="stat-value" id="vecCount">-</div><div class="stat-label">向量</div></div>
      <div class="stat"><div class="stat-value" id="version">-</div><div class="stat-label">版本</div></div>
    </div>
    <div>
      <span class="badge badge-green">MCP Active</span>
      <span class="badge badge-blue">Ollama</span>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:1rem;margin-bottom:0.8rem;">🔍 搜索测试</h2>
    <input type="text" id="searchInput" placeholder="输入搜索关键词..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
    <div class="result" id="searchResult">输入关键词后点击搜索</div>
  </div>

  <div class="card">
    <h2 style="font-size:1rem;margin-bottom:0.8rem;">🔗 快捷链接</h2>
    <p style="font-size:0.85rem;line-height:2;">
      <a href="/health" style="color:#7B61FF;">/health</a> ·
      <a href="/metrics" style="color:#7B61FF;">/metrics</a> ·
      <a href="/v1/search?q=test" style="color:#7B61FF;">/v1/search?q=test</a> ·
      <a href="/v1/context?q=test" style="color:#7B61FF;">/v1/context?q=test</a>
    </p>
  </div>

  <div class="footer">Cortex v2.4 · 单二进制 · MCP 原生 · 完全本地</div>
</div>

<script>
async function loadStatus() {
  try {
    const r = await fetch('/admin/api/status');
    const d = await r.json();
    document.getElementById('docCount').textContent = d.documents ?? 'N/A';
    document.getElementById('chunkCount').textContent = d.chunks ?? 'N/A';
    document.getElementById('vecCount').textContent = d.vectors ?? 'N/A';
    document.getElementById('version').textContent = d.version ?? 'N/A';
  } catch(e) {}
}
async function doSearch() {
  const q = document.getElementById('searchInput').value;
  const el = document.getElementById('searchResult');
  if(!q) { el.textContent = '请输入搜索词'; return; }
  try {
    const r = await fetch('/v1/search?q='+encodeURIComponent(q));
    const d = await r.json();
    el.textContent = JSON.stringify(d, null, 2);
  } catch(e) {
    el.textContent = 'Error: ' + e.message;
  }
}
loadStatus();
</script>
</body>
</html>
