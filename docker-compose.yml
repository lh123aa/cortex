services:
  cortex:
    build: .
    container_name: cortex
    env_file:
      - .env.example
    volumes:
      - cortex-data:/data
      - ./knowledge_base:/knowledge_base:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    command: ["./cortex", "mcp"]
    healthcheck:
      test: ["CMD", "test", "-f", "/data/cortex.db"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  cortex-data:
  ollama-data:
